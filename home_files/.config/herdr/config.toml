onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

# [theme.custom]
# surface0 = "#2e3330"
# accent = "white"
# overlay0 = "#2f2f2f"
# panel_bg = "reset"

[terminal]
new_cwd = "follow"

[keys]
# General / session
prefix = "ctrl+a"
help = "prefix+?"
settings = "prefix+,"
detach = "prefix+d"
reload_config = "prefix+<"
goto = "prefix+s"
toggle_sidebar = "prefix+b"
open_notification_target = "prefix+y"

# Workspaces
workspace_picker = "prefix+p"
# Free Shift+N for previous-tab, matching tmux.
new_workspace = "prefix+w"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+c"
previous_workspace = ""
next_workspace = ""
switch_workspace = ""

# Worktrees
new_worktree = "prefix+g"
open_worktree = "prefix+o"
remove_worktree = "prefix+shift+r"

# Agents
previous_agent = ""
next_agent = ""
focus_agent = "prefix+/"

# Tabs
new_tab = "prefix+t"
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"
next_tab = "prefix+n"
previous_tab = "prefix+shift+n"
move_tab_previous = ""
move_tab_next = ""
switch_tab = "prefix+1..9"

# Panes
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'
rename_pane = "prefix+shift+p"
close_pane = "prefix+x"
zoom = "prefix+z"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

cycle_pane_next = ""
cycle_pane_previous = ""
last_pane = "prefix+tab"

# Pane resizing
resize_mode = "prefix+r"
resize_pane_left = ""
resize_pane_down = ""
resize_pane_up = ""
resize_pane_right = ""

# Pane swapping
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

# Copy / scrollback / remote clipboard
# Escape cancels Herdr's prefix mode; use [ to enter its vi-style copy mode.
copy_mode = "prefix+["
edit_scrollback = "prefix+e"
remote_image_paste = "ctrl+v"

# Workspace selector (navigate mode; no prefix)
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_left = "ctrl+h"
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
navigate_pane_right = "ctrl+l"

# Legacy indexed shortcuts (unbound by default).
# Prefer switch_tab, switch_workspace, and focus_agent above.
[keys.indexed]
tabs = ""
workspaces = ""
agents = ""

